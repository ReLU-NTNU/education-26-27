[project]
name = "relu-lecture-two"
version = "0.1.0"
description = "Lecture two: NumPy, pandas, Matplotlib and PyTorch exercises in marimo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marimo==0.24.2",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "platformdirs>=4,<5",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
