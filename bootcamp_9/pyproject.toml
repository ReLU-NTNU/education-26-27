[project]
name = "relu-bootcamp-nine"
version = "0.1.0"
description = "Time series lecture workbooks in marimo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marimo==0.24.2",
    "matplotlib>=3.10.8,<4",
    "numpy>=2.4.2,<3",
    "pandas>=3.0.0,<4",
    "scikit-learn>=1.8.0,<2",
    "seaborn>=0.13.2,<0.14",
    "torch>=2.10.0,<3",
    "timestral",
]

[tool.uv]
package = false

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
