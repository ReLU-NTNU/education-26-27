name: Bootcamp 6 portability
# Optional: run manually when cross-platform verification is wanted.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check lockfile and binary dependencies
        run: uv sync --locked --no-build --project bootcamp_6
      - name: Run launcher and notebook checks
        run: uv run --locked --project bootcamp_6 python bootcamp_6/tests/check_setup.py
